<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AgentMaster</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1e1e22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Not black-translucent: under the status bar, iOS sizes a home-screen app shorter than the screen by
       the status bar's height and leaves a band at the bottom that covers the composer. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AgentMaster">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="icon.png" width="56" height="56" alt="">
      <h1>AgentMaster</h1>
      <p>Paste the access token the server printed at startup, or open the link it printed.</p>
      <input id="login-token" type="password" placeholder="Access token" autocomplete="current-password" autofocus>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="primary">Connect</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside id="list-pane" class="list-pane"></aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <section id="home-pane" class="home-pane" hidden></section>

    <section id="detail-pane" class="detail-pane" hidden>
      <header id="detail-topbar" class="detail-topbar">
        <button id="sidebar-toggle" class="icon-button sidebar-expand-button" type="button" data-sidebar-toggle aria-controls="list-pane">
          <svg data-icon="layout-sidebar"></svg>
        </button>
        <button id="back-to-home" class="back-button" type="button" title="Back to home">
          <svg data-icon="arrow-left"></svg><span>Home</span>
        </button>
        <div class="session-toolbar">
          <div id="view-toggle" class="mode-switch" role="group" aria-label="Session view">
            <button type="button" data-view="chat" class="active" aria-pressed="true">Chat</button>
            <button type="button" data-view="terminal" aria-pressed="false">Terminal</button>
          </div>
          <div id="session-telemetry" class="session-telemetry"></div>
        </div>
        <div class="session-menu-wrap">
          <button id="session-menu-button" class="icon-button" type="button" title="More">
            <svg data-icon="dots"></svg>
          </button>
          <div id="session-menu" class="session-menu" hidden>
            <button id="menu-rename" type="button">Rename</button>
            <button id="menu-close" type="button" class="danger">Close session</button>
          </div>
        </div>
      </header>

      <section id="detail-summary" class="detail-summary"></section>

      <div id="chat-pane" class="chat-pane" hidden>
        <div id="chat-scroll" class="detail-scroll">
          <div id="decision-area"></div>
          <div id="normal-area" hidden>
            <nav id="detail-tabs" class="detail-tabs">
              <button type="button" data-tab="conversation" class="active" aria-pressed="true">Conversation</button>
              <button type="button" data-tab="changes" aria-pressed="false">Changes<span id="changes-count"></span></button>
            </nav>
            <div id="tab-conversation">
              <div id="resolved-requests" class="resolved-requests"></div>
              <div id="chat-messages" class="chat-messages"></div>
            </div>
            <div id="tab-changes" hidden></div>
          </div>
        </div>
        <footer id="decision-footer" class="decision-footer" hidden></footer>
        <form id="composer" class="composer">
          <div id="composer-status" class="composer-status"></div>
          <div class="composer-surface">
            <div id="draft-attachments" class="draft-attachments" role="list" aria-label="Attachments to send" hidden></div>
            <p id="attachment-status" class="attachment-status" role="status" aria-live="polite" hidden></p>
            <div class="composer-field">
              <button id="composer-attach" class="attach-button" type="button" title="Add an attachment" aria-label="Add an attachment"
                      aria-haspopup="menu" aria-expanded="false"><svg data-icon="plus"></svg></button>
              <textarea id="composer-text" rows="1" placeholder="Add to this session…" aria-describedby="attachment-status"></textarea>
              <button id="composer-send" type="submit" title="Send" aria-label="Send"><svg data-icon="arrow-up"></svg></button>
            </div>
            <div class="attachment-drop-hint" aria-hidden="true"><svg data-icon="plus"></svg>Drop to add attachments</div>
          </div>
        </form>
      </div>

      <div id="terminal-pane" class="terminal-pane" hidden>
        <div id="terminals" class="terminals">
          <div id="terminal-empty" class="terminal-empty">No session</div>
        </div>
        <div id="terminal-inputbar" class="terminal-inputbar">
          <div id="terminal-attachments-note" class="terminal-attachments-note" hidden>
            <span id="terminal-attachments-note-text"></span>
            <button type="button" id="terminal-attachments-note-view">View</button>
          </div>
          <form id="terminal-send-form" class="terminal-send-form">
            <button id="terminal-attach" class="attach-button" type="button" title="Add an attachment" aria-label="Add an attachment"
                    aria-haspopup="menu" aria-expanded="false"><svg data-icon="plus"></svg></button>
            <input id="terminal-send-input" autocomplete="off" spellcheck="false" placeholder="Add to this session…">
            <button type="submit" title="Send"><svg data-icon="arrow-up"></svg></button>
          </form>
          <div class="terminal-keys">
            <button type="button" data-key="esc">Esc</button>
            <button type="button" data-key="up">↑</button>
            <button type="button" data-key="down">↓</button>
            <button type="button" data-key="tab">Tab</button>
            <button type="button" data-key="enter">Enter</button>
          </div>
        </div>
      </div>
    </section>

    <section id="settings-pane" class="settings-pane" hidden>
      <header class="settings-topbar">
        <button id="settings-back" class="back-button" type="button">
          <svg data-icon="arrow-left"></svg><span id="settings-back-label">Back</span>
        </button>
        <span id="settings-save-state" class="settings-save-state" hidden></span>
      </header>
      <div class="settings-body">
        <nav id="settings-sidebar" class="settings-sidebar"></nav>
        <div class="settings-detail">
          <div id="settings-detail-scroll" class="settings-detail-scroll"></div>
          <footer id="settings-scope" class="settings-scope" hidden></footer>
        </div>
      </div>
    </section>
  </div>

  <dialog id="new-dialog" class="dialog">
    <form id="new-form" class="new-form">
      <div class="dialog-heading"><h1>New Session</h1>
        <button type="button" id="close-new" class="icon-button" aria-label="Cancel"><svg data-icon="x"></svg></button></div>
      <div class="field">
        <label>Agent</label>
        <div id="new-agents" class="agent-cards"></div>
      </div>
      <div class="field">
        <label for="new-model">Model</label>
        <select id="new-model"></select>
        <input id="new-model-custom" type="text" placeholder="Model id" hidden>
      </div>
      <div class="field">
        <label for="new-project">Project</label>
        <div class="row">
          <input id="new-project" type="text" list="new-recents" placeholder="/path/on/the/server" spellcheck="false">
          <datalist id="new-recents"></datalist>
          <button type="button" id="new-browse">Browse…</button>
        </div>
      </div>
      <p id="new-error" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="new-cancel">Cancel</button>
        <button type="submit" id="new-start" class="primary">Start</button>
      </div>
    </form>
  </dialog>

  <dialog id="folder-dialog" class="dialog">
    <div class="folder">
      <h1>Choose a folder</h1>
      <p id="folder-path" class="path"></p>
      <ul id="folder-list" class="folder-list"></ul>
      <div class="actions">
        <button type="button" id="folder-cancel">Cancel</button>
        <button type="button" id="folder-choose" class="primary">Choose This Folder</button>
      </div>
    </div>
  </dialog>

  <!-- The "+" menu, moved next to whichever input opened it; its items come from ATTACH_KINDS in app.js. -->
  <div id="attach-menu" class="attach-menu" role="menu" hidden></div>
  <input id="attach-input" type="file" hidden>

  <!-- The "+" menu's mobile equivalent: a bottom sheet, since there is no room to anchor a dropdown there. -->
  <dialog id="attach-sheet" class="dialog attach-sheet" aria-labelledby="attach-sheet-title">
    <div class="attach-sheet-heading">
      <h2 id="attach-sheet-title">Add attachment</h2>
      <button type="button" id="attach-sheet-close" class="icon-button" aria-label="Close">
        <svg data-icon="x"></svg>
      </button>
    </div>
    <div id="attach-sheet-choices" class="attach-sheet-choices"></div>
  </dialog>

  <!-- A draft or sent attachment's full-size image or file summary; built in openAttachmentPreview(). -->
  <dialog id="attachment-preview-dialog" class="dialog attachment-preview-dialog"></dialog>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
