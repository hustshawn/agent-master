# Pushing a tag like v0.2.0 builds everything and publishes a GitHub release with:
#   AgentMaster-v0.2.0.dmg                                 the Mac app
#   agentmaster-server-v0.2.0-linux-{x86_64,aarch64}.tar.gz  the web edition's server, Swift runtime linked in
#   install-server.sh                                      installs or upgrades the server on a Linux machine
# Pull requests and main only run the tests (ci.yml), so tests CI already passed on this commit are not run
# again here: the app skips them when CI's macOS job passed on it, the x86_64 server when its Linux job did.
# CI tests nothing on arm64, so that server always runs them, and so does a side CI skipped or has not finished.
# To try the full release build before tagging, run this workflow by hand (Actions → Release → Run workflow):
# it builds and packages everything and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # CI's runs on this commit, for `tested`

jobs:
  # Which of CI's jobs passed on this commit. A skipped job does not count: CI skips the side a change cannot
  # affect, whatever that side's last run left behind.
  tested:
    runs-on: ubuntu-24.04
    outputs:
      mac: ${{ steps.ci.outputs.mac }}
      linux: ${{ steps.ci.outputs.linux }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mac=false linux=false
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs[].id'); do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.conclusion == "success") | .name')
            grep -qx mac <<< "$passed" && mac=true
            grep -qx linux <<< "$passed" && linux=true
          done
          echo "mac=$mac" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "CI passed on $GITHUB_SHA: macOS $mac · Linux x86_64 $linux"

  app:
    needs: tested
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          # Xcode 26 and later ship the Metal toolchain separately; SwiftTerm compiles a Metal shader.
          xcodebuild -downloadComponent MetalToolchain

      - name: Test
        if: needs.tested.outputs.mac != 'true'
        run: swift test

      - name: Bundle
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG=v0.0.0; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/bundle.sh

      - name: Disk image
        run: ./scripts/make-dmg.sh "AgentMaster-$TAG.dmg"

      # Only handed to the publish job; kept for a day so they do not fill the private repo's artifact quota.
      - uses: actions/upload-artifact@v6
        with:
          name: app
          path: AgentMaster-*.dmg
          retention-days: 1

  server:
    needs: tested
    strategy:
      # Report each architecture on its own instead of cancelling the other on the first failure.
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5

      # CI runs these on Linux x86_64 only.
      - name: Test
        if: matrix.runner == 'ubuntu-24.04-arm' || needs.tested.outputs.linux != 'true'
        run: swift test

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG=v0.0.0; fi
          scripts/package-server.sh "build/agentmaster-server-$TAG-linux-$(uname -m)"

      - uses: actions/upload-artifact@v6
        with:
          name: server-${{ matrix.runner }}
          path: build/agentmaster-server-*.tar.gz
          retention-days: 1

  publish:
    if: github.ref_type == 'tag'
    needs: [app, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install-server.sh \
            --title "AgentMaster $GITHUB_REF_NAME" --generate-notes --notes "$(cat <<'EOF'
          **Mac app**: Apple silicon, macOS 14 or later. Open the disk image and drag AgentMaster to Applications.
          The app is ad-hoc signed, not notarized, so macOS blocks it on first open. After copying it to Applications, run:

          ```
          xattr -dr com.apple.quarantine /Applications/AgentMaster.app
          ```

          **Web edition server**: Linux x86_64 or aarch64, no Swift needed. On the server, as the user who runs `claude`/`codex`:

          ```
          gh release download -R hustshawn/agent-master -p install-server.sh -O - | bash
          ```
          EOF
          )"
